<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCS NFI Daily Report - Liquid Glass Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            background-attachment: fixed;
            min-height: screen;
        }
        
        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            color: #1e3a8a;
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid #3b82f6;
            outline: none;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        /* Tombol Simpan PDF Transparan */
        .glass-button-submit {
            background: rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #1e40af;
            border-radius: 50px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            transition: all 0.3s ease;
        }

        .glass-button-submit:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.2);
        }

        .glass-button-submit:active {
            transform: scale(0.95);
        }

        .photo-container {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.6);
            aspect-ratio: 1/1;
            background: rgba(255, 255, 255, 0.2);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .blob {
            position: fixed;
            z-index: -1;
            filter: blur(40px);
            border-radius: 50%;
            opacity: 0.6;
        }
    </style>
</head>
<body class="pb-40">
    <div class="blob bg-blue-300 w-64 h-64 -top-20 -left-20 animate-pulse"></div>
    <div class="blob bg-purple-200 w-96 h-96 -bottom-32 -right-32"></div>

    <header class="p-8">
        <div class="flex flex-col items-center text-center space-y-3">
            <div class="glass-card p-5 text-blue-600 shadow-lg">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-blue-900 tracking-tight">OCS NFI Daily Report</h1>
                <p class="text-xs font-semibold text-blue-700 uppercase tracking-widest opacity-70">By Pohara Ayub</p>
            </div>
        </div>
    </header>

    <main class="px-5 space-y-6 max-w-md mx-auto">
        <section class="glass-card p-6 space-y-5">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-blue-900 mb-2 ml-1 uppercase tracking-widest opacity-60">Nama Pekerjaan</label>
                    <input type="text" id="jobName" class="glass-input w-full p-4 text-sm font-medium" placeholder="Contoh: Pembersihan Lobi Utama">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-blue-900 mb-2 ml-1 uppercase tracking-widest opacity-60">Tanggal</label>
                        <input type="date" id="reportDate" class="glass-input w-full p-4 text-sm font-medium">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-blue-900 mb-2 ml-1 uppercase tracking-widest opacity-60">Shift</label>
                        <select id="shift" class="glass-input w-full p-4 text-sm font-medium h-[54px] appearance-none">
                            <option value="Pagi">Pagi</option>
                            <option value="Siang">Siang</option>
                            <option value="Malam">Malam</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <section class="glass-card p-6 space-y-5">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-blue-900 uppercase tracking-widest opacity-60">Dokumentasi Foto</h2>
                <div class="flex items-center space-x-2">
                    <button onclick="clearAllPhotos()" id="btnClearAll" class="hidden text-[10px] font-bold text-red-600 bg-white/50 backdrop-blur-sm px-3 py-1.5 rounded-full uppercase border border-red-100">Hapus</button>
                    <span id="photoCount" class="bg-blue-600 text-white text-[10px] font-black px-3 py-1.5 rounded-full shadow-md">0</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <label class="flex flex-col items-center justify-center py-6 glass-input cursor-pointer hover:bg-white/40 active:scale-95 transition-all">
                    <svg class="w-7 h-7 text-blue-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span class="text-[9px] font-extrabold text-blue-800 uppercase tracking-tighter">Kamera</span>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                </label>

                <label class="flex flex-col items-center justify-center py-6 glass-input cursor-pointer hover:bg-white/40 active:scale-95 transition-all">
                    <svg class="w-7 h-7 text-gray-500 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-[9px] font-extrabold text-gray-700 uppercase tracking-tighter">Galeri</span>
                    <input type="file" id="galleryInput" accept="image/*" multiple class="hidden">
                </label>
            </div>

            <div id="loadingOverlay" class="hidden flex items-center justify-center p-4 bg-white/30 backdrop-blur rounded-2xl border border-white/50">
                <span class="loader mr-3"></span>
                <span id="loadingMsg" class="text-[10px] font-bold text-blue-900 uppercase">Processing...</span>
            </div>

            <div id="photoGrid" class="grid grid-cols-3 gap-3"></div>
        </section>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-8 flex justify-center pointer-events-none z-50">
        <button onclick="generatePDF()" id="btnSubmit" class="glass-button-submit pointer-events-auto px-10 py-5 flex items-center space-x-3 max-w-xs w-full justify-center">
            <span id="btnIcon">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </span>
            <span id="btnText" class="font-extrabold text-xs tracking-[0.2em] uppercase">Simpan PDF</span>
        </button>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        const cameraInput = document.getElementById('cameraInput');
        const galleryInput = document.getElementById('galleryInput');
        const photoGrid = document.getElementById('photoGrid');
        const photoCountDisplay = document.getElementById('photoCount');
        const btnClearAll = document.getElementById('btnClearAll');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingMsg = document.getElementById('loadingMsg');
        const reportDateInput = document.getElementById('reportDate');
        
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        reportDateInput.value = new Date().toISOString().split('T')[0];
        let capturedPhotos = [];

        cameraInput.addEventListener('change', handleFiles);
        galleryInput.addEventListener('change', handleFiles);

        async function handleFiles(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            loadingOverlay.classList.remove('hidden');

            for (let i = 0; i < files.length; i++) {
                loadingMsg.innerText = `PROSES ${i + 1}/${files.length}`;
                await processImage(files[i]);
            }
            
            e.target.value = '';
            updatePhotoCount();
            btnSubmit.disabled = false;
            loadingOverlay.classList.add('hidden');
        }

        function updatePhotoCount() {
            photoCountDisplay.innerText = capturedPhotos.length;
            if (capturedPhotos.length > 0) {
                btnClearAll.classList.remove('hidden');
            } else {
                btnClearAll.classList.add('hidden');
            }
        }

        function clearAllPhotos() {
            if (capturedPhotos.length === 0) return;
            const confirmClear = confirm(`Hapus semua (${capturedPhotos.length}) foto?`);
            if (confirmClear) {
                capturedPhotos = [];
                photoGrid.innerHTML = '';
                updatePhotoCount();
            }
        }

        function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const MAX_SIZE = 1200; 
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }

                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const now = new Date();
                        const stampText = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

                        const fontSize = Math.floor(width / 25);
                        ctx.font = `bold ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
                        ctx.fillStyle = "#00ff00";
                        ctx.textAlign = "center";
                        ctx.strokeStyle = "black";
                        ctx.lineWidth = Math.floor(fontSize / 6);
                        ctx.strokeText(stampText, width / 2, height - (fontSize * 1));
                        ctx.fillText(stampText, width / 2, height - (fontSize * 1));
                        
                        const stampedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        const photoObj = { data: stampedDataUrl, ratio: width / height };
                        capturedPhotos.push(photoObj);
                        
                        const div = document.createElement('div');
                        div.className = 'photo-container shadow-md';
                        const photoId = 'photo-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
                        div.id = photoId;
                        div.innerHTML = `
                            <img src="${stampedDataUrl}" class="w-full h-full object-cover">
                            <button onclick="removePhoto('${photoId}')" class="absolute top-1.5 right-1.5 bg-red-500/80 backdrop-blur-sm text-white rounded-lg w-6 h-6 flex items-center justify-center text-[12px] font-bold">×</button>
                        `;
                        
                        photoGrid.appendChild(div);
                        resolve();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        window.removePhoto = function(photoId) {
            const container = document.getElementById(photoId);
            if (!container) return;
            const index = Array.from(photoGrid.children).indexOf(container);
            if (index !== -1) {
                capturedPhotos.splice(index, 1);
                container.remove();
                updatePhotoCount();
            }
        };

        async function generatePDF() {
            const btn = document.getElementById('btnSubmit');
            const job = document.getElementById('jobName').value || 'Pekerjaan';
            const shift = document.getElementById('shift').value;
            const dateVal = reportDateInput.value;

            if (capturedPhotos.length === 0) return alert("Pilih foto terlebih dahulu!");

            btn.disabled = true;
            const originalBtnText = document.getElementById('btnText').innerText;
            document.getElementById('btnText').innerText = "GENERATING...";

            try {
                const doc = new jsPDF({ compress: true });
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                
                const dObj = new Date(dateVal);
                const dayName = days[dObj.getDay()];
                const dateFileName = `${dObj.getDate()} ${months[dObj.getMonth()]} ${dObj.getFullYear()}`;

                for (let i = 0; i < capturedPhotos.length; i++) {
                    if (i > 0) doc.addPage();
                    
                    const photo = capturedPhotos[i];
                    const maxW = pageWidth;
                    const maxH = pageHeight;
                    
                    let dW = maxW;
                    let dH = dW / photo.ratio;
                    
                    if (dH > maxH) {
                        dH = maxH;
                        dW = dH * photo.ratio;
                    }

                    doc.addImage(photo.data, 'JPEG', (pageWidth - dW) / 2, (pageHeight - dH) / 2, dW, dH, undefined, 'FAST');
                }

                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2, '0')}.${now.getMinutes().toString().padStart(2, '0')}`;
                
                const fileName = `${job} ${dayName} ${dateFileName} ${timeStr} ${shift}.pdf`;
                
                const pdfBlob = doc.output('blob');
                const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
                    await navigator.share({ files: [pdfFile], title: 'OCS Photo Report' });
                } else {
                    doc.save(fileName);
                }

            } catch (err) {
                console.error(err);
                alert("Gagal membuat PDF.");
            } finally {
                btn.disabled = false;
                document.getElementById('btnText').innerText = originalBtnText;
            }
        }
    </script>
</body>
</html>
